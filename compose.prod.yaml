name: navarro-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: app
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    env_file: .env.production
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: web
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - app_storage:/var/www/html/storage:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=30
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE requerida}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME requerido}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerida}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requerida}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  app_storage:
  mysql_data:
  caddy_data:
  caddy_config:
